name: Run tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'scripts/**'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install devbox
      uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0

    - name: build local binaries for test
      run: devbox run -- make build lint test

    - name: code tests
      run: devbox run -- make test GOFLAGS="-v"

    - name: e2e tests
      run: devbox run -- make e2e-tests
