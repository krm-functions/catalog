name: Build and sign multi-arch container

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'Makefile.test'
      - 'catalog.json'
      - 'scripts/**'
      - 'docs/**'
      - 'examples/**'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install devbox
      uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

    - name: Build schema bundle for kubeconform
      run: |
        devbox run -- scripts/source-schemas.sh

    - name: Log in to the Container registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | devbox run -- ko login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build and push containers
      run: devbox run -- make push | tee manifest.log

    - name: Sign container
      run: devbox run -- make sign

    - name: Update catalog
      run: devbox run -- scripts/update-image-digest-in-docs.sh

    - name: Create catalog update PR
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ github.token }}
        commit-message: 'Update catalog for build ${{ github.sha }}'
        title: 'Update catalog.json for build ${{ github.sha }}'
        body: |
          Update catalog.json after release of build ${{ github.sha }}
        #labels: automated pr
        branch: catalog/update
        delete-branch: true
        add-paths: catalog.json
